<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <!-- Logo Romusworld SVG -->
  <defs>
    <linearGradient id="romusGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c41e3a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a01729;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fond -->
  <rect width="200" height="60" fill="#ffffff" stroke="#e9ecef" stroke-width="1"/>
  
  <!-- Icône maison/bâtiment -->
  <g transform="translate(10, 10)">
    <rect x="0" y="20" width="30" height="20" fill="url(#romusGradient)"/>
    <polygon points="0,20 15,5 30,20" fill="#495057"/>
    <rect x="8" y="25" width="6" height="10" fill="#ffffff"/>
    <rect x="16" y="25" width="6" height="6" fill="#ffffff"/>
  </g>
  
  <!-- Texte ROMUSWORLD -->
  <text x="50" y="25" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="url(#romusGradient)">ROMUS</text>
  <text x="50" y="42" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#495057">WORLD</text>
  
  <!-- Sous-titre -->
  <text x="50" y="52" font-family="Arial, sans-serif" font-size="8" fill="#6c757d">Solutions murs & sols</text>
</svg>

